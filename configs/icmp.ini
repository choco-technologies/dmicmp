# icmp.ini - dmsystem unit that loads the dmicmp module at boot, so this
# device starts answering ICMP Echo Requests (ping) with no manual step.
# Drop it into libsystemd's units directory - see dmsystem's configuration
# docs (https://github.com/choco-technologies/dmsystem/blob/main/app/libsystemd/docs/configuration.md)
# - and adjust the path in "args" below to wherever this dmicmp release was
# installed (${destination}/dmicmp/configs/icmp-start.dme, if installed via
# dmicmp.dmr's own "configs" entry). See ../docs/service.md for the full
# rationale.
description=Answer ICMP Echo Requests (ping) by loading the dmicmp module
exec=dmell
args=/opt/dmicmp/configs/icmp-start.dme
type=oneshot

# type=oneshot: icmp-start.dme only needs to run once - dmicmp stays loaded
# and answering pings on its own once dmod_init() has run (see
# ../src/dmicmp.c), so there is no long-running process for this unit to
# keep alive. "service stop icmp" has nothing left to kill once this has run
# to completion - libsystemd has no ExecStop-style key yet - so to stop
# answering pings, run icmp-stop.dme directly instead (see ../docs/service.md).
