# icmp.ini - dmsystem unit that loads and enables the dmicmp module at boot,
# so this device starts answering ICMP Echo Requests (ping) with no manual
# step. Drop it into libsystemd's units directory - see dmsystem's
# configuration docs (https://github.com/choco-technologies/dmsystem/blob/main/app/libsystemd/docs/configuration.md#typemodule-services-backed-by-a-library-module-not-a-process).
description=Answer ICMP Echo Requests (ping) by loading the dmicmp module
exec=dmicmp
type=module

# type=module: dmicmp is a Library-type DMOD module, not an Application - it
# has no main(), so it cannot be spawned as a process the way a "simple"/
# "oneshot" unit is. type=module tells libsystemd to load+enable "exec" as a
# module instead (the DMOD loader's own module lifecycle) when the unit is
# started, and to disable+unload it when the unit is stopped - see
# ../docs/service.md and dmsystem's configuration docs linked above.
